[package]
name = "helio"
version = "0.19.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "High-level facade over helio-core for stable scene handles and O(1)-style CPU updates"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "0.7"
bytemuck = { workspace = true, features = ["derive"] }
glam.workspace = true
image = { workspace = true, features = ["png"] }
helio-core = { workspace = true }
helio-controls = { workspace = true }
helio-scenedb = { workspace = true }
helio-portal-core = { workspace = true }
helio-foliage-core = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-tsr = { workspace = true }

libhelio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
quark.workspace = true
helio-voxel-core = { workspace = true }
helio-bake = { path = "crates/helio-bake", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
meshopt = "0.6.2"

[features]
default = ["profiling", "xr"]
profiling = ["helio-core/profiling"]
bake = ["helio-bake", "uuid"]
xr = ["dep:helio-xr", "dep:openxr"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

# OpenXR (Vulkan) integration. Native-only: helio-xr compiles out entirely on
# wasm32 (its crate root is `#![cfg(not(target_arch = "wasm32"))]`), and the
# openxr/ash/liblocing deps it pulls in do not build for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
helio-xr = { workspace = true, optional = true }
# Matches the openxr version helio-xr builds against; only the session-state /
# frame-state enums used by the XR render loop are referenced directly.
openxr = { version = "0.21", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Used for DXGI exclusive-fullscreen path (IDXGIFactory1::MakeWindowAssociation).
# Version must match wgpu-hal's transitive dep so types are unified.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[dev-dependencies]
pulsar_scenedb.workspace = true
pulsar_scenedb_derive.workspace = true

[workspace]
members = [
    "crates/*",
    "crates/passes/2d/*",
    "crates/passes/3d/*",
    "../Helio-Examples",
    "../Helio-Examples/helio-web-demos",
    "../Helio-Examples/web-tools",
]
exclude = [
    "vendor/nebula",
    "vendor/wgpu",
    "crates/bake_cache",
    # Android demos retain their own post-move manifest work and are not part
    # of the Linux desktop/demo build.
    "crates/helio-android-demos",
]
resolver = "2"

[workspace.dependencies]
wgpu = { path = "vendor/wgpu/wgpu", default-features = true, features = ["vulkan", "vulkan-portability", "metal", "dx12", "gles", "webgpu", "wgsl", "trace"] }
blade-graphics = { git = "https://github.com/tristanpoland/blade", rev = "d85bd14a78ed7729abc298906e87332257674a02" }
blade-macros = { git = "https://github.com/tristanpoland/blade", rev = "d85bd14a78ed7729abc298906e87332257674a02" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
env_logger = "0.11"
log = "0.4"
solid-rs = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-gltf = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-fbx = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-obj = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-usd = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-unreal = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
quark = { git = "https://github.com/Far-Beyond-Pulsar/Quark", package = "quark" }
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
pulsar_scenedb = { path = "../SceneDB/crates/pulsar_scenedb" }
pulsar_scenedb_derive = { path = "../SceneDB/crates/pulsar_scenedb_derive" }
helio-core = { path = "crates/helio-core" }
helio-scenedb = { path = "crates/helio-scenedb" }
helio-portal-core = { path = "crates/helio-portal-core" }
helio-default-graphs = { path = "crates/helio-default-graphs" }
wasm-bindgen = "0.2"
helio-pass-tsr = { path = "crates/passes/3d/helio-pass-tsr" }
helio-pass-portal-cull = { path = "crates/passes/3d/helio-pass-portal-cull" }
helio-pass-portal-instances = { path = "crates/passes/3d/helio-pass-portal-instances" }
helio-pass-postprocess = { path = "crates/passes/3d/helio-pass-postprocess" }
helio-pass-volumetric-fog = { path = "crates/passes/3d/helio-pass-volumetric-fog" }
helio = { path = "." }
helio-controls = { path = "crates/helio-controls" }
libhelio = { path = "crates/libhelio" }
helio-xr = { path = "crates/helio-xr" }
helio-asset-compat = { path = "crates/helio-asset-compat" }
helio-voxel-core = { path = "crates/helio-voxel-core" }
helio-foliage-core = { path = "crates/helio-foliage-core" }
helio-pass-foliage-place = { path = "crates/passes/3d/helio-pass-foliage-place" }
helio-pass-foliage-gbuffer = { path = "crates/passes/3d/helio-pass-foliage-gbuffer" }
helio-planet-voxel-core = { path = "crates/helio-planet-voxel-core" }
helio-pass-planetary-voxel = { path = "crates/passes/3d/helio-pass-planetary-voxel" }
helio-pass-corona = { path = "crates/passes/3d/helio-pass-corona" }
helio-pass-flare = { path = "crates/passes/3d/helio-pass-flare" }
helio-pass-decal = { path = "crates/passes/3d/helio-pass-decal" }
helio-pass-sdf = { path = "crates/passes/3d/helio-pass-sdf" }
helio-pass-voxel-mesh = { path = "crates/passes/3d/helio-pass-voxel-mesh" }
helio-pass-fxaa = { path = "crates/passes/3d/helio-pass-fxaa" }
helio-pass-dof = { path = "crates/passes/3d/helio-pass-dof" }
helio-pass-sprite-batch = { path = "crates/passes/2d/helio-pass-sprite-batch" }
helio-pass-sprite-cull = { path = "crates/passes/2d/helio-pass-sprite-cull" }
helio-pass-sprite-simulate = { path = "crates/passes/2d/helio-pass-sprite-simulate" }
helio-pass-radiance-cascades-2d = { path = "crates/passes/2d/helio-pass-radiance-cascades-2d" }

[patch.crates-io]
wgpu = { path = "vendor/wgpu/wgpu" }
